name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clean build
        run: |
          make clean
          make

      - name: Test current source
        run: make test

      - name: Install Qt UI test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 qt6-qpa-plugins

      - name: Run real offscreen UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 Native/Tests/test_overlay.py

      - name: Run strict visual UI matrix
        run: make visual-test PYTHON=/usr/bin/python3

      - name: Run sanitizer integration tests
        run: make asan
