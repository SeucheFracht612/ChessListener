<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChessListener</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main id="popup-root" aria-busy="false">
    <header>
      <span class="mark" aria-hidden="true">
        <span>C</span><span></span><span></span><span>L</span>
      </span>
      <div class="brand-copy">
        <p class="eyebrow">Local chess analysis</p>
        <h1>ChessListener</h1>
      </div>
      <span
        id="status-badge"
        class="badge"
        data-status="idle"
        aria-live="polite"
        aria-atomic="true"
      >Idle</span>
    </header>

    <section class="session-block" aria-live="polite" aria-atomic="true">
      <p class="section-label">Current board</p>
      <p id="session-label" class="session-label">No active board</p>
      <p id="session-detail" class="session-detail">
        Open a Chess.com board to begin.
      </p>
    </section>

    <section id="error-panel" class="error-panel" role="alert" hidden>
      <strong id="error-title">Analysis could not continue</strong>
      <p id="error" class="error"></p>
      <details id="error-details" hidden>
        <summary>Technical details</summary>
        <code id="error-technical"></code>
      </details>
    </section>

    <div class="actions">
      <button id="analyze" class="primary" type="button">
        Start analysis
      </button>
      <button id="stop" class="danger" type="button" disabled>
        Stop session
      </button>
    </div>

    <footer>
      <span id="version">v0.9.5</span>
      <span>Local &amp; offline</span>
    </footer>
  </main>
</body>
</html>
