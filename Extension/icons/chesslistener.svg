<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"
     width="128" height="128" role="img">
  <title>ChessListener</title>
  <desc>A four-square chessboard mark with the letters C and L.</desc>
  <defs>
    <clipPath id="board-clip">
      <rect x="12" y="12" width="104" height="104" rx="9"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="17" fill="#151714"/>
  <g clip-path="url(#board-clip)">
    <rect x="12" y="12" width="52" height="52" fill="#e8d5b4"/>
    <rect x="64" y="12" width="52" height="52" fill="#987652"/>
    <rect x="12" y="64" width="52" height="52" fill="#987652"/>
    <rect x="64" y="64" width="52" height="52" fill="#e8d5b4"/>
  </g>
  <rect x="12" y="12" width="104" height="104" rx="9"
        fill="none" stroke="#535b52" stroke-width="3"/>
  <g fill="#151714" font-family="DejaVu Sans Mono, monospace"
     font-size="40" font-weight="700" text-anchor="middle">
    <text x="38" y="53">C</text>
    <text x="90" y="106">L</text>
  </g>
</svg>
